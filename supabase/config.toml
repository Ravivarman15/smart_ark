# ─── Client-invoked functions: require a valid user JWT ──────────────────────
# Both are called from the authenticated app via supabase.functions.invoke(...).
# The SDK automatically forwards the user's access token, which the Supabase
# platform verifies at the edge before the function runs.
[functions.send-daily-report]
verify_jwt = true

[functions.send-whatsapp]
verify_jwt = true

# ─── send-aisensy: WhatsApp queue drainer ────────────────────────────────────
# Drains message_queue → AiSensy. TWO legitimate callers: the app (authenticated
# JWT, via aisensyService.dispatchViaEdge) and pg_cron.
#
# verify_jwt = false, and the reason matters: it was `true`, which meant the
# platform rejected pg_cron — which carries no user session — before the function
# ran. So no drain schedule was possible, and a queued message only ever went out
# if a human happened to click something. Rows enqueued by an edge function or a
# background flow waited indefinitely; four were found stuck on 2026-08-14.
#
# The gate now lives INSIDE the function (the provisioning-worker pattern):
# x-cron-key matching CRON_SECRET, or a resolvable authenticated caller. It fails
# closed when CRON_SECRET is unset.
# Requires secrets: AISENSY_API_KEY, CRON_SECRET (optional: AISENSY_DEFAULT_CAMPAIGN).
[functions.send-aisensy]
verify_jwt = false

# ─── aisensy-webhook: provider delivery-status callbacks ─────────────────────
# External provider call — no user JWT. Authenticated by AISENSY_WEBHOOK_SECRET
# (?secret= or x-webhook-secret header) checked inside the function.
[functions.aisensy-webhook]
verify_jwt = false

# ─── end-of-day-check: client-invoked by admin, verify JWT at the edge ───────
[functions.end-of-day-check]
verify_jwt = true

# ─── lead-intake: PUBLIC Meta-ads / landing-page lead webhook ────────────────
# No user JWT (external callers). Optionally gated by LEAD_INTAKE_SECRET
# (?key= or x-intake-key header) checked inside the function. Runs the full
# intake automation pipeline server-side with the service role.
[functions.lead-intake]
verify_jwt = false

# ─── Cron-invoked functions: gated by CRON_SECRET header inside the function ─
# The platform cannot verify a JWT here (cron has no user session), so the
# function itself checks `x-cron-key` against the CRON_SECRET env var.
[functions.kpi-engine]
verify_jwt = false

[functions.sla-checker]
verify_jwt = false

# ─── seed-users: one-time setup, gated by management role inside the function ─
[functions.seed-users]
verify_jwt = true

# ─── verify-credentials: PROVE login works before sending ID/password ────────
# Resolves the auth account, rotates to a known temp password, then performs a
# real signInWithPassword to prove the credentials log in. Only a verified
# result lets the client send the credential WhatsApp. Gated by admin/mgmt.
# Requires the auto-provided SUPABASE_ANON_KEY for the login proof.
[functions.verify-credentials]
verify_jwt = true

# ─── student-parent-accounts: student/parent auth provisioning + login proof ─
# Creates real auth.users logins for students/parents, rotates passwords, proves
# login via signInWithPassword, manages status + parent↔student links. Gated to
# admin/management. Uses the auto-provided SUPABASE_ANON_KEY for the login proof.
[functions.student-parent-accounts]
verify_jwt = true

# ─── invite-staff: staff provisioning + welcome email, gated by admin/mgmt ───
# Creates the auth user, sends the Brevo welcome email, tracks onboarding.
# Requires secrets: BREVO_API_KEY, SENDER_EMAIL (optional: SENDER_NAME).
[functions.invite-staff]
verify_jwt = true

# ─── send-email: generic transactional email, gated by admin/mgmt role ──────
# Reusable Brevo sender for all non-staff transactional emails.
[functions.send-email]
verify_jwt = true

# ─── platform-admin: control-plane privileged operations ─────────────────────
# Provisioning, status changes, impersonation, platform-user invites.
# verify_jwt = true so the platform verifies the signature at the edge; the
# function then independently resolves the caller against platform_users and
# checks MFA + capability. Neither check is sufficient alone.
[functions.platform-admin]
verify_jwt = true

# ─── public-onboarding: PUBLIC self-service trial provisioning ───────────────
# verify_jwt = false because check_slug and track_signup run for anonymous
# visitors who have not signed up yet. The `provision` action verifies the
# bearer token against GoTrue itself AND requires a confirmed email — the
# platform-level JWT check would be too coarse here (it would block the two
# genuinely public actions) and too weak there (it would not check
# email_confirmed_at).
[functions.public-onboarding]
verify_jwt = false

# ─── public-form: PUBLIC marketing form intake + notification ────────────────
# verify_jwt = false because the callers are anonymous website visitors filling
# in Book a Demo / Contact / Careers. There is no session to verify and never
# will be.
#
# The compensating controls live inside the function, because they have to:
# a payload size ceiling, a per-email rate limit, an allow-list of registry
# fields (anything else in the body is dropped), email validation that rejects
# control characters, and phone normalisation. Crucially the request body may
# name a form type and its own fields and NOTHING else — recipients are
# resolved server-side from platform_users, so a visitor cannot address the
# notification at anyone.
[functions.public-form]
verify_jwt = false

# ─── provisioning-worker: drains the provisioning queue ──────────────────────
# verify_jwt = false because the primary caller is CRON, which has no user
# session. The function authorises internally: a CRON_SECRET header, or a
# verified platform user. Neither path trusts the request body.
[functions.provisioning-worker]
verify_jwt = false

# ─── razorpay-webhook: PROVIDER callbacks ────────────────────────────────────
# verify_jwt = false — Razorpay has no user session. Authenticated instead by
# HMAC-SHA256 over the RAW body against RAZORPAY_WEBHOOK_SECRET, verified
# inside the function. This is the ONLY place money-related state changes.
[functions.razorpay-webhook]
verify_jwt = false

# ─── billing-checkout: tenant-initiated payment setup ────────────────────────
# Creates Razorpay orders/subscriptions. Deliberately CANNOT activate anything.
[functions.billing-checkout]
verify_jwt = true

# ─── billing-lifecycle: trial/grace/suspension sweep (cron) ──────────────────
# verify_jwt = false because cron has no user session; gated by CRON_SECRET or
# a verified platform user inside the function.
[functions.billing-lifecycle]
verify_jwt = false

# ─── domain-verify: DNS / SSL / SMTP verification ────────────────────────────
# Real DNS-over-HTTPS lookups plus provider credential validation. verify_jwt
# = true; the function additionally requires an org admin or a platform user,
# and a tenant can only ever act on its OWN domains.
[functions.domain-verify]
verify_jwt = true
