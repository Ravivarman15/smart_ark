<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>ARK Management </title>
    <meta name="description" content="ARK Management" />
    <link rel="icon" type="image/jpeg" href="/public/WhatsApp Image 2026-02-04 at 11.06.19.jpeg" />


    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="ARK Management" />
    <meta property="og:description" content="ARK Management" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Mobile browser chrome colour — updated at runtime by ThemeProvider. -->
    <meta name="theme-color" content="#0a2543" />

    <!-- No-flash theme boot: runs before React paints, so the saved theme
         is in place before the first stylesheet evaluation. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ark-theme');
          if (t !== 'ark-light' && t !== 'ark-dark') t = 'ark-dark';
          document.documentElement.dataset.theme = t;
          document.documentElement.classList.add('theme-instant');
        } catch (_) {
          document.documentElement.dataset.theme = 'ark-dark';
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
