<!doctype html>
<!-- data-theme is set STATICALLY as well as by the boot script below.
     Without it, a no-JS visitor or a crawler reading a prerendered marketing
     page falls through to the bare :root palette, which is still the dark one —
     so the page Google indexes would not be the page a visitor sees. -->
<html lang="en" data-theme="ark-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>ARK Management </title>
    <meta name="description" content="ARK Management" />
    <link rel="icon" type="image/jpeg" href="/public/WhatsApp Image 2026-02-04 at 11.06.19.jpeg" />


    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="ARK Management" />
    <meta property="og:description" content="ARK Management" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Mobile browser chrome colour — updated at runtime by ThemeProvider.
         Matches THEMES["ark-light"].preview.background, the default surface. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- No-flash theme boot: runs before React paints, so the saved theme
         is in place before the first stylesheet evaluation. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ark-theme');
          // Fallback must match DEFAULT_THEME in src/core/theme/themes.ts.
          if (t !== 'ark-light' && t !== 'ark-dark') t = 'ark-light';
          document.documentElement.dataset.theme = t;
          document.documentElement.classList.add('theme-instant');
        } catch (_) {
          document.documentElement.dataset.theme = 'ark-light';
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
