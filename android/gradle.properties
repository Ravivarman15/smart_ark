# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the daemon process.
# Bumped to 2 GB; default 512 MB is not enough for modern AGP + R8.
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel project builds — safe since the two subprojects (:app,
# :capacitor-cordova-android-plugins, :capacitor-android) are decoupled.
org.gradle.parallel=true

# Cache build outputs between invocations for faster incremental builds.
org.gradle.caching=true

# Configure-on-demand: only configure projects that are needed for the
# requested tasks.
org.gradle.configureondemand=true

# AndroidX package structure.
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Skip the legacy "default" JetifierEmbed path — all our deps are AndroidX.
android.enableJetifier=false
