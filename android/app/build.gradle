apply plugin: 'com.android.application'

android {
    namespace = "com.example.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.example.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Modern replacement for the deprecated `aaptOptions` block
        // (aaptOptions is removed in AGP 9). Exclude common VCS / OS
        // cruft from the packaged assets dir.
        androidResources {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        debug {
            // Keep debug fast: no shrinking, full logs.
            minifyEnabled false
        }
        release {
            // R8 shrink + obfuscate on release. Keep rules live in proguard-rules.pro;
            // Capacitor's JS-bridge classes are explicitly kept there so the
            // WebView bridge does not silently break at runtime.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // TODO(devops): wire a real signingConfig before shipping to Play
            // Store. Right now `assembleRelease` produces an unsigned APK —
            // adequate for sideload testing only.
        }
    }

    // Lint: surface new issues but never block the build.
    lint {
        abortOnError false
        checkReleaseBuilds true
        // Housekeeping warnings we can't meaningfully fix from app code:
        disable 'IconLocation', 'IconDipSize', 'IconDuplicatesConfig', 'MonochromeLauncherIcon'
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
            ]
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

// Override Capacitor's Java 21 requirement to match installed JDK 17.
// If you upgrade your local JDK to 21 you can drop this block.
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push notifications won't work.")
}
